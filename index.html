<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04040f">
<title>mojarrita 🤍</title>

<!-- Fuentes opcionales (si no hay internet, usa las cursivas del sistema) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

<style>
  :root{
    --gold:#ffd23f;
    --gold-deep:#ffb01f;
    --gold-soft:rgba(214,178,98,.62);
    --ivory:#f6e7b8;
    --night:#04040f;
    --script:'Dancing Script','Snell Roundhand','Segoe Script','Apple Chancery','Brush Script MT',cursive;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;overflow-x:hidden;background:var(--night)}
  body{
    min-height:100vh;min-height:100svh;
    background:
      radial-gradient(ellipse 90% 55% at 50% 38%, rgba(52,38,110,.38) 0%, transparent 70%),
      radial-gradient(ellipse at 50% 30%, #131238 0%, #080820 48%, #03030c 100%);
    color:var(--ivory);
    font-family:var(--serif);
  }
  body.locked{overflow:hidden}
  body::after{ /* viñeta */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  #fx{position:fixed;inset:0;z-index:3;pointer-events:none}

  .stage{
    position:relative;z-index:1;
    width:100%;max-width:480px;margin:0 auto;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:max(env(safe-area-inset-top),16px) 16px max(env(safe-area-inset-bottom),12px);
  }

  /* ───────── Título ───────── */
  .title{
    font-family:var(--script);font-weight:700;
    font-size:clamp(2.9rem,15vw,5.2rem);
    line-height:1.1;text-align:center;color:var(--gold);
    text-shadow:0 0 6px rgba(255,214,70,.95),0 0 18px rgba(255,190,30,.75),0 0 40px rgba(255,150,0,.5);
    animation:titleIn 2s cubic-bezier(.2,.7,.2,1) both, titleGlow 4.5s ease-in-out 2s infinite;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateY(-12px) scale(.96);filter:blur(10px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }
  @keyframes titleGlow{
    0%,100%{text-shadow:0 0 6px rgba(255,214,70,.95),0 0 18px rgba(255,190,30,.75),0 0 40px rgba(255,150,0,.5)}
    50%{text-shadow:0 0 9px rgba(255,230,120,1),0 0 28px rgba(255,200,40,.95),0 0 60px rgba(255,160,0,.7)}
  }

  /* ───────── Reproductor ───────── */
  .player{
    position:relative;width:min(92%,380px);
    display:flex;align-items:center;gap:14px;
    padding:10px 26px 10px 12px;border-radius:999px;
    background:linear-gradient(180deg,rgba(18,16,44,.7),rgba(8,8,24,.7));
    border:1px solid rgba(255,205,90,.42);
    box-shadow:0 0 22px rgba(255,190,40,.22),inset 0 0 14px rgba(255,200,60,.07);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    animation:riseIn 1.4s cubic-bezier(.2,.7,.2,1) .5s both;
  }
  .player.playing{animation:riseIn 1.4s cubic-bezier(.2,.7,.2,1) .5s both, playerGlow 3.2s ease-in-out infinite}
  @keyframes playerGlow{
    0%,100%{box-shadow:0 0 22px rgba(255,190,40,.22),inset 0 0 14px rgba(255,200,60,.07);border-color:rgba(255,205,90,.42)}
    50%{box-shadow:0 0 34px rgba(255,190,40,.42),inset 0 0 18px rgba(255,200,60,.14);border-color:rgba(255,215,110,.7)}
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .player::before,.player::after{ /* destellos decorativos en el borde */
    content:"✦";position:absolute;color:var(--gold);font-size:.62rem;text-shadow:0 0 8px var(--gold);
    animation:twinkleText 3.6s ease-in-out infinite;
  }
  .player::before{top:-5px;left:32px}
  .player::after{bottom:-5px;right:44px;animation-delay:1.6s}
  @keyframes twinkleText{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

  .play{
    flex:none;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;
    display:grid;place-items:center;
    background:radial-gradient(circle at 35% 28%,#ffe066,#ffb200 55%,#ff8f00 100%);
    box-shadow:0 0 16px rgba(255,170,0,.75),inset 0 -3px 6px rgba(160,70,0,.35);
    transition:transform .2s ease,box-shadow .3s ease;
  }
  .play:active{transform:scale(.93)}
  .play:focus-visible{outline:2px solid #fff3b0;outline-offset:3px}
  .play svg{width:22px;height:22px;fill:#4b2600}
  .play .i-pause{display:none}
  .playing .play .i-play{display:none}
  .playing .play .i-pause{display:block}
  .playing .play{animation:btnPulse 2.4s ease-in-out infinite}
  @keyframes btnPulse{0%,100%{box-shadow:0 0 14px rgba(255,170,0,.7),inset 0 -3px 6px rgba(160,70,0,.35)}50%{box-shadow:0 0 24px rgba(255,190,20,1),inset 0 -3px 6px rgba(160,70,0,.35)}}

  .info{flex:1;min-width:0}
  .song{
    font-family:var(--script);font-weight:600;font-size:1.08rem;color:#ffe9a8;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;
    text-shadow:0 0 8px rgba(255,200,60,.35);
  }
  .bar-hit{padding:9px 0;cursor:pointer;touch-action:none}
  .bar{position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.16)}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:linear-gradient(90deg,#ffb200,#ffe066);box-shadow:0 0 8px rgba(255,190,30,.7)}
  .knob{position:absolute;right:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#ffe27a;box-shadow:0 0 10px #ffc21a}
  .times{display:flex;justify-content:space-between;font-family:var(--serif);font-size:.72rem;letter-spacing:.04em;color:rgba(255,235,180,.7);margin-top:-3px}

  /* ───────── Ramo ───────── */
  .bouquet{
    position:relative;display:flex;justify-content:center;
    animation:bouquetIn 2s ease .7s both;
  }
  @keyframes bouquetIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
  .halo{
    position:absolute;left:50%;top:44%;width:130%;aspect-ratio:1;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,190,30,.30) 0%,rgba(255,170,0,.10) 38%,transparent 66%);
    animation:haloPulse 6s ease-in-out infinite;pointer-events:none;
  }
  @keyframes haloPulse{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
  .bouquet svg{
    position:relative;display:block;
    width:min(96vw,430px,calc(47vh*.857));
    width:min(96vw,430px,calc(47svh*.857));
    height:auto;overflow:visible;
    filter:drop-shadow(0 0 10px rgba(255,190,30,.4));
    transform-origin:50% 100%;animation:bouquetSway 9s ease-in-out infinite;
  }
  @keyframes bouquetSway{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}

  /* animaciones internas del SVG */
  .stem,.stem-hl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s cubic-bezier(.4,.1,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .bloom{transform-box:fill-box;transform-origin:center;animation:bloom 1.5s cubic-bezier(.2,1.15,.3,1) both}
  @keyframes bloom{from{opacity:0;transform:scale(0) rotate(-50deg)}to{opacity:1;transform:none}}
  .sway{transform-box:fill-box;transform-origin:50% 170%;animation:sway 6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
  .leafsway{transform-box:fill-box;transform-origin:0% 50%;animation:leafSway 5.5s ease-in-out infinite}
  @keyframes leafSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .fernL,.fernR{transform-box:fill-box;animation:fernSway 8s ease-in-out infinite}
  .fernL{transform-origin:100% 100%}
  .fernR{transform-origin:0% 100%;animation-delay:-3s}
  @keyframes fernSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
  .glint{transform-box:fill-box;transform-origin:center;opacity:0;animation:glint 4.8s ease-in-out infinite}
  @keyframes glint{0%,60%,100%{opacity:0;transform:scale(0) rotate(0)}75%{opacity:1;transform:scale(1) rotate(45deg)}90%{opacity:0;transform:scale(.3) rotate(90deg)}}

  /* ───────── Flor especial ───────── */
  .solo{display:flex;flex-direction:column;align-items:center;animation:riseIn 1.6s ease 2.2s both}
  .solo-btn{
    position:relative;background:none;border:0;cursor:pointer;padding:6px 18px 0;
    animation:breathe 3.6s ease-in-out infinite;
  }
  .solo-btn:focus-visible{outline:2px solid #fff3b0;outline-offset:4px;border-radius:24px}
  .solo-btn::before{
    content:"";position:absolute;left:50%;top:38%;width:170%;aspect-ratio:1;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,200,40,.42),rgba(255,170,0,.12) 45%,transparent 68%);
    animation:soloGlow 3.6s ease-in-out infinite;pointer-events:none;
  }
  @keyframes breathe{0%,100%{transform:scale(.97)}50%{transform:scale(1.06)}}
  @keyframes soloGlow{0%,100%{opacity:.55}50%{opacity:1}}
  .solo-btn svg{
    position:relative;display:block;
    width:min(30vw,130px,calc(16vh*.762));
    width:min(30vw,130px,calc(16svh*.762));
    min-width:84px;height:auto;overflow:visible;
    filter:drop-shadow(0 0 12px rgba(255,190,30,.7));
  }
  .hint{
    font-family:var(--script);font-size:1.12rem;color:var(--gold);letter-spacing:.03em;margin-top:2px;
    text-shadow:0 0 10px rgba(255,200,50,.55);animation:hintPulse 3.2s ease-in-out infinite;
  }
  @keyframes hintPulse{0%,100%{opacity:.55}50%{opacity:1}}

  .sign{
    margin-top:6px;font-family:var(--script);font-size:.98rem;color:var(--gold-soft);text-align:center;
    letter-spacing:.03em;animation:riseIn 2s ease 3s both;
  }

  /* ───────── Mensaje ───────── */
  .overlay{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
    background:radial-gradient(ellipse at center,rgba(6,6,24,.72),rgba(1,1,8,.9));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s;
  }
  .overlay.open{opacity:1;visibility:visible}
  .card{
    position:relative;width:min(90vw,420px);max-height:84vh;max-height:84svh;overflow-y:auto;
    padding:34px 28px 26px;text-align:center;border-radius:28px;
    background:linear-gradient(160deg,rgba(18,17,50,.94),rgba(6,6,20,.96));
    border:1px solid rgba(255,205,90,.55);
    box-shadow:0 0 40px rgba(255,190,40,.2),0 0 90px rgba(255,170,0,.1),inset 0 0 30px rgba(255,200,60,.06);
    opacity:0;transform:scale(.86) translateY(16px);
    transition:opacity .7s ease .12s,transform .8s cubic-bezier(.2,.9,.3,1.15) .12s;
  }
  .overlay.open .card{opacity:1;transform:none}
  .card::before,.card::after{content:"✦";position:absolute;color:var(--gold);font-size:.8rem;text-shadow:0 0 10px var(--gold);animation:twinkleText 4s ease-in-out infinite}
  .card::before{top:14px;left:20px}
  .card::after{bottom:14px;right:20px;animation-delay:2s}
  .card h2{
    font-family:var(--script);font-weight:700;font-size:clamp(1.9rem,8.5vw,2.4rem);line-height:1.2;color:var(--gold);
    text-shadow:0 0 10px rgba(255,205,60,.75),0 0 28px rgba(255,160,0,.4);
  }
  .divider{width:96px;height:1px;margin:16px auto 18px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 8px var(--gold)}
  .msg{
    font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.22rem;line-height:1.7;color:var(--ivory);
    white-space:pre-line;   /* conserva los saltos de línea */
    overflow-wrap:break-word;
  }
  .close{
    margin-top:24px;padding:9px 26px;border-radius:999px;cursor:pointer;
    font-family:var(--script);font-weight:600;font-size:1.1rem;color:var(--gold);
    background:rgba(255,200,60,.06);border:1px solid rgba(255,205,90,.5);
    box-shadow:0 0 12px rgba(255,190,40,.18);transition:background .3s,box-shadow .3s,transform .2s;
  }
  .close:hover{background:rgba(255,200,60,.14);box-shadow:0 0 20px rgba(255,190,40,.4)}
  .close:active{transform:scale(.95)}
  .close:focus-visible{outline:2px solid #fff3b0;outline-offset:3px}

  @media (max-height:640px){
    .title{font-size:clamp(2.4rem,12vw,4rem)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    .stem,.stem-hl{stroke-dashoffset:0}
  }
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<main class="stage">

  <h1 class="title">mojarrita 🤍</h1>

  <section class="player" id="player" aria-label="Reproductor de música">
    <button class="play" id="playBtn" type="button" aria-label="Reproducir">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
    <div class="info">
      <div class="song" id="songTitle"></div>
      <div class="bar-hit" id="barHit">
        <div class="bar"><div class="fill" id="fill"><i class="knob"></i></div></div>
      </div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
  </section>

  <div class="bouquet" id="bouquet"><div class="halo"></div></div>

  <div class="solo">
    <button class="solo-btn" id="soloBtn" type="button" aria-label="Toca la flor para leer un mensaje">
      <span id="soloSvg"></span>
    </button>
    <p class="hint">toca la flor 💛</p>
  </div>

  <footer class="sign" id="sign"></footer>
</main>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="msgTitle">
    <h2 id="msgTitle">Para mi mojarrita 💛</h2>
    <div class="divider"></div>
    <p class="msg" id="msgText"></p>
    <button class="close" id="closeBtn" type="button">Cerrar</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   ✏️  CONFIGURACIÓN — cambia aquí lo que necesites
   ════════════════════════════════════════════════════════════ */
const CONFIG = {

  // 1) Nombre de la canción (lo que se ve en el reproductor)
  songTitle: "🤍",

  // 2) Archivo MP3: ponlo en la misma carpeta que este index.html
  audioSrc: "musica.mp3",
  loop: true,           // true = se repite al terminar

  // 3) Mensaje para ella (puedes escribir varias líneas, se respetan los saltos)
  message: `
Hola, mi Juli. ¿Cómo vas? 

Espero que ya no estés tan triste como estabas antes y que cada día te vayas sintiendo un poquito mejor. Hoy, en el Día de las Flores Amarillas, quería darte este pequeño detalle. Espero que pueda alegrarte aunque sea un poquito el día y quiero que sepas que lo hice con muchísimo amor para ti. 

Tú sabes que, si estuvieses acá conmigo, te daría un jardín entero, pero lamentablemente no es así. Aun así, quería hacerte llegar un pedacito de todo ese cariño hasta allá
  `,

  // 4) Firma pequeña de abajo
  signature: "Hecho con mucho cariño "
};
/* ════════════════════════════════════════════════════════════ */


/* ───────── Textos ───────── */
document.getElementById('songTitle').textContent = CONFIG.songTitle;
document.getElementById('sign').textContent = CONFIG.signature;
document.getElementById('msgText').textContent =
  CONFIG.message.split('\n').map(l => l.trim()).join('\n').trim();


/* ════════════════════════════════════════════════════════════
   🌻  FLORES Y RAMO (SVG generado, sin imágenes externas)
   ════════════════════════════════════════════════════════════ */
(function buildArt(){
  const PETAL = "M0,-14 C-26,-34 -32,-74 -9,-91 Q0,-85 9,-91 C32,-74 26,-34 0,-14Z";

  function layer(n, scale, offset, fill, stroke, vein){
    let s = '';
    for(let i=0;i<n;i++){
      const r = offset + i*360/n;
      s += `<g transform="rotate(${r}) scale(${scale})">
        <path d="${PETAL}" fill="${fill}" stroke="${stroke}" stroke-width="1.2" stroke-linejoin="round"/>
        ${vein ? `<path d="M0,-26 Q1.5,-52 0,-76" fill="none" stroke="rgba(200,100,0,.32)" stroke-width="1.4" stroke-linecap="round"/>`:''}
      </g>`;
    }
    return s;
  }

  let stripes = '';
  for(let i=0;i<22;i++){
    stripes += `<line x1="0" y1="-5" x2="0" y2="-27" transform="rotate(${i*360/22})" stroke="${i%2?'#7d4d18':'#5a3410'}" stroke-width="2.6" stroke-linecap="round"/>`;
  }

  const flowerDef = `<g id="flower">
    ${layer(12,1,0,'url(#gBack)','#d47c00',false)}
    ${layer(12,.82,15,'url(#gFront)','#e39100',true)}
    ${layer(12,.58,0,'url(#gInner)','#eea500',true)}
    <circle r="36" fill="#ff9d00" opacity=".55"/>
    <circle r="30" fill="#3a1f0a" stroke="#8a5216" stroke-width="2"/>
    ${stripes}
    <circle r="6" fill="#1b0d03"/>
    <ellipse cx="-10" cy="-13" rx="10" ry="4.5" fill="#fff" opacity=".13" transform="rotate(-30 -10 -13)"/>
  </g>`;

  const leafShape = "M0,0 C8,-11 28,-12 42,0 C28,12 8,11 0,0Z";
  const defs = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gBack"  x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f29200"/><stop offset=".55" stop-color="#ffb511"/><stop offset="1" stop-color="#ffd63a"/></linearGradient>
    <linearGradient id="gFront" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffae00"/><stop offset=".5" stop-color="#ffd21f"/><stop offset="1" stop-color="#fff07a"/></linearGradient>
    <linearGradient id="gInner" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc01a"/><stop offset="1" stop-color="#fff5a0"/></linearGradient>
    <linearGradient id="gLeaf"  x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f7a32"/><stop offset="1" stop-color="#5cc04c"/></linearGradient>
    <linearGradient id="gLeafD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f3d1c"/><stop offset="1" stop-color="#25703a"/></linearGradient>
    ${flowerDef}
    <g id="leaf"><path d="${leafShape}" fill="url(#gLeaf)"/><path d="M1,0 L38,0" stroke="rgba(255,255,255,.2)" stroke-width="1" fill="none"/></g>
    <g id="leafD"><path d="${leafShape}" fill="url(#gLeafD)"/><path d="M1,0 L38,0" stroke="rgba(255,255,255,.08)" stroke-width="1" fill="none"/></g>
    <path id="spark" d="M0,-9 Q1,-1 9,0 Q1,1 0,9 Q-1,1 -9,0 Q-1,-1 0,-9Z"/>
  </defs></svg>`;
  document.body.insertAdjacentHTML('afterbegin', defs);

  /* helpers */
  const leaf = (x,y,a,s,d,id='leaf') =>
    `<g transform="translate(${x},${y}) rotate(${a}) scale(${s})"><g class="leafsway" style="animation-delay:${d}s"><use href="#${id}"/></g></g>`;

  function fern(p0,p1,p2){
    let out = `<path d="M${p0[0]},${p0[1]} Q${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="none" stroke="#1d6531" stroke-width="2.4" stroke-linecap="round"/>`;
    for(let t=.1;t<=1.001;t+=.075){
      const u=1-t;
      const x=u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0];
      const y=u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1];
      const dx=2*u*(p1[0]-p0[0])+2*t*(p2[0]-p1[0]);
      const dy=2*u*(p1[1]-p0[1])+2*t*(p2[1]-p1[1]);
      const ang=Math.atan2(dy,dx)*180/Math.PI;
      const sc=.85*(1-t*.62);
      out += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(ang-58).toFixed(1)}) scale(${sc.toFixed(2)})"><use href="#leafD"/></g>`;
      out += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(ang+58).toFixed(1)}) scale(${sc.toFixed(2)})"><use href="#leafD"/></g>`;
    }
    return out;
  }

  /* tallos (base común en 180,392) */
  const stemPaths = [
    "M180,392 Q150,270 100,80",
    "M180,392 Q222,250 250,60",
    "M180,392 Q130,320 86,215",
    "M180,392 Q240,310 272,200",
    "M180,392 Q170,265 176,150"
  ];
  const stems = stemPaths.map((d,i)=>

     <path class="stem-hl" pathLength="1" d="${d}" transform="translate(-1.2,0)" fill="none" stroke="#6bd05a" stroke-width="1.6" stroke-linecap="round" opacity=".55" style="animation-delay:${.6+i*.14}s"/>`

  const leaves = [

  /* flores del ramo: [x, y, escala] — la central va al final (encima) */
  const flowers = [[100,80,.56],[250,60,.6],[86,215,.56],[272,200,.58],[176,150,.6]]
    .map(([x,y,s],i)=>
      `<g transform="translate(${x},${y}) scale(${s})"><g class="bloom" style="animation-delay:${1.0+i*.28}s"><g class="sway" style="animation-duration:${5+i*.9}s;animation-delay:${(-i*1.3).toFixed(1)}s"><use href="#flower"/></g></g></g>`
    ).join('');

  /* destellos sobre las flores */
  const sparks = [[62,58,1.1,0],[300,112,1,1.6],[150,28,.9,3.1],[334,228,.8,2.2],[38,178,.9,.9],[212,112,1.15,3.8],[120,150,.8,2.7]]
    .map(([x,y,s,d])=>`<g transform="translate(${x},${y}) scale(${s})"><g class="glint" style="animation-delay:${d}s"><use href="#spark" fill="#fff8cf"/></g></g>`).join('');

  const bouquet = `<svg viewBox="0 0 360 420" role="img" aria-label="Ramo de flores amarillas">
    <ellipse cx="180" cy="398" rx="120" ry="14" fill="rgba(0,0,0,.45)"/>
    <g class="fernL">${fern([174,398],[92,396],[16,352])}</g>
    <g class="fernR">${fern([186,398],[268,396],[344,352])}</g>

  document.getElementById('bouquet').insertAdjacentHTML('beforeend', bouquet);

  /* flor individual */
  const solo = `<svg viewBox="0 0 160 210" aria-hidden="true">

    <g transform="translate(122,34) scale(.9)"><g class="glint" style="animation-delay:1.2s"><use href="#spark" fill="#fff8cf"/></g></g>
    <g transform="translate(34,96) scale(.7)"><g class="glint" style="animation-delay:3s"><use href="#spark" fill="#fff8cf"/></g></g>
  </svg>`;
  document.getElementById('soloSvg').innerHTML = solo;
})();


/* ════════════════════════════════════════════════════════════
   ✨  PARTÍCULAS (estrellas, pétalos de luz, destellos)
   ════════════════════════════════════════════════════════════ */
(function particles(){
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, stars = [], petals = [], flashes = [], bursts = [];
  const rnd = (a,b)=>a+Math.random()*(b-a);

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    init();
  }
  function init(){
    const k = reduce ? .4 : 1;
    stars = Array.from({length:Math.round(Math.min(150,W*H/6500)*k)},()=>({
      x:rnd(0,W), y:rnd(0,H), r:rnd(.3,1.4), ph:rnd(0,6.28), sp:rnd(.6,2.2),
      vx:rnd(-2,2), vy:rnd(-3,1), c: Math.random()<.22 ? '190,205,255' : '255,225,130'
    }));
    petals = Array.from({length:Math.round(Math.min(34,W*H/14000)*k)},()=>({
      x:rnd(0,W), y:rnd(0,H), rx:rnd(2,6.5), ph:rnd(0,6.28),
      vy:rnd(-9,22), vx:rnd(-4,4), sw:rnd(4,16), rot:rnd(0,6.28), vr:rnd(-.5,.5), a:rnd(.55,1)
    }));
  }
  function star4(x,y,s,a){
    ctx.save(); ctx.translate(x,y); ctx.globalAlpha = a;
    ctx.fillStyle = '#fff4b8'; ctx.shadowColor = '#ffc928'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0,-s); ctx.quadraticCurveTo(s*.12,-s*.12,s,0);
    ctx.quadraticCurveTo(s*.12,s*.12,0,s); ctx.quadraticCurveTo(-s*.12,s*.12,-s,0);
    ctx.quadraticCurveTo(-s*.12,-s*.12,0,-s); ctx.fill(); ctx.restore();
  }

  let last = performance.now(), t = 0, nextFlash = 1;
  function frame(now){
    const dt = Math.min(.05,(now-last)/1000); last = now; t += dt;
    ctx.clearRect(0,0,W,H);

    /* estrellas */
    for(const s of stars){
      s.x += s.vx*dt; s.y += s.vy*dt;
      if(s.x<-5) s.x=W+5; if(s.x>W+5) s.x=-5; if(s.y<-5) s.y=H+5; if(s.y>H+5) s.y=-5;
      const a = .2 + .8*(.5+.5*Math.sin(t*s.sp+s.ph));
      ctx.globalAlpha = a; ctx.fillStyle = `rgb(${s.c})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
    }

    /* pétalos / puntos de luz amarillos */
    ctx.shadowColor = 'rgba(255,190,20,.9)'; ctx.shadowBlur = 12; ctx.fillStyle = '#ffcf2e';
    for(const p of petals){
      p.y += p.vy*dt; p.x += (p.vx + Math.sin(t*.6+p.ph)*p.sw)*dt; p.rot += p.vr*dt;
      if(p.y>H+12) p.y=-12; if(p.y<-12) p.y=H+12;
      if(p.x>W+12) p.x=-12; if(p.x<-12) p.x=W+12;
      ctx.globalAlpha = p.a*(.75+.25*Math.sin(t*1.3+p.ph));
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.rx,p.rx*1.35,p.rot,0,6.283); ctx.fill();
    }
    ctx.shadowBlur = 0;

    /* destellos ocasionales */
    if(!reduce && t > nextFlash){
      flashes.push({x:rnd(10,W-10), y:rnd(10,H-10), age:0, life:rnd(.9,1.6), s:rnd(6,13)});
      nextFlash = t + rnd(.8,2);
    }
    flashes = flashes.filter(f=>{
      f.age += dt; const p = f.age/f.life; if(p>=1) return false;
      star4(f.x,f.y,f.s*(.4+.6*Math.sin(p*Math.PI)), Math.sin(p*Math.PI)); return true;
    });

    /* explosión al tocar la flor */
    bursts = bursts.filter(b=>{
      b.age += dt; if(b.age>b.life) return false;
      b.x += b.vx*dt; b.y += b.vy*dt; b.vy += 60*dt; b.vx *= (1-1.2*dt);
      const a = 1-b.age/b.life;
      ctx.globalAlpha = a; ctx.fillStyle = b.c; ctx.shadowColor = '#ffc21a'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(.5+a*.5),0,6.283); ctx.fill(); ctx.shadowBlur = 0;
      return true;
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize(); requestAnimationFrame(frame);

  window.__burst = (x,y)=>{
    for(let i=0;i<34;i++){
      const a = rnd(0,6.283), sp = rnd(40,190);
      bursts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,r:rnd(1.4,3.6),age:0,life:rnd(.9,1.6),c:Math.random()<.5?'#ffe27a':'#fff4b8'});
    }
  };
})();


/* ════════════════════════════════════════════════════════════
   🎵  REPRODUCTOR
   ════════════════════════════════════════════════════════════ */
(function player(){
  const audio = new Audio();
  audio.preload = 'auto'; audio.loop = !!CONFIG.loop; audio.src = CONFIG.audioSrc;

  const box = document.getElementById('player'),
        btn = document.getElementById('playBtn'),
        fill = document.getElementById('fill'),
        hit = document.getElementById('barHit'),
        cur = document.getElementById('cur'),
        dur = document.getElementById('dur');

  const fmt = s => { if(!isFinite(s)) s = 0; const m = Math.floor(s/60), r = Math.floor(s%60); return m+':'+String(r).padStart(2,'0'); };
  let userPaused = false, started = false, raf = null, dragging = false;

  function render(){
    const d = audio.duration, c = audio.currentTime;
    fill.style.width = (isFinite(d) && d>0 ? (c/d*100) : 0) + '%';
    cur.textContent = fmt(c);
  }
  function loop(){ render(); raf = audio.paused ? null : requestAnimationFrame(loop); }
  function setUI(){
    const on = !audio.paused;
    box.classList.toggle('playing', on);
    btn.setAttribute('aria-label', on ? 'Pausar' : 'Reproducir');
    if(on && !raf) loop();
  }

  audio.addEventListener('loadedmetadata', ()=>{ dur.textContent = fmt(audio.duration); render(); });
  audio.addEventListener('durationchange', ()=>{ dur.textContent = fmt(audio.duration); });
  audio.addEventListener('play', setUI);
  audio.addEventListener('pause', ()=>{ setUI(); render(); });
  audio.addEventListener('ended', ()=>{ setUI(); render(); });
  audio.addEventListener('error', ()=> console.warn('No se encontró el MP3: coloca "'+CONFIG.audioSrc+'" junto a index.html'));

  function play(){ return audio.play().then(()=>{ started = true; }).catch(()=>{}); }

  btn.addEventListener('click', ()=>{
    if(audio.paused){ userPaused = false; play(); } else { userPaused = true; audio.pause(); }
  });

  /* barra de progreso: clic y arrastre */
  function seek(e){
    const r = hit.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (e.clientX - r.left)/r.width));
    if(isFinite(audio.duration)){ audio.currentTime = p*audio.duration; render(); }
  }
  hit.addEventListener('pointerdown', e=>{ dragging = true; hit.setPointerCapture(e.pointerId); seek(e); });
  hit.addEventListener('pointermove', e=>{ if(dragging) seek(e); });
  hit.addEventListener('pointerup',   ()=>{ dragging = false; });
  hit.addEventListener('pointercancel',()=>{ dragging = false; });

  /* Autoplay: se intenta al cargar; si el navegador lo bloquea (iPhone/Android),
     arranca con el primer toque en la pantalla. */
  play();
  function firstTouch(e){
    if(started){ cleanup(); return; }
    if(userPaused || e.target.closest('#playBtn')) return;
    play().then(()=>{ if(started) cleanup(); });
  }
  function cleanup(){ ['click','touchend'].forEach(ev=>document.removeEventListener(ev, firstTouch)); }
  ['click','touchend'].forEach(ev=>document.addEventListener(ev, firstTouch));
})();


/* ════════════════════════════════════════════════════════════
   💌  MENSAJE AL TOCAR LA FLOR
   ════════════════════════════════════════════════════════════ */
(function message(){
  const overlay = document.getElementById('overlay'),
        soloBtn = document.getElementById('soloBtn'),
        closeBtn = document.getElementById('closeBtn');

  function open(){
    const r = soloBtn.getBoundingClientRect();
    if(window.__burst) window.__burst(r.left + r.width/2, r.top + r.height*.42);
    overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false');
    document.body.classList.add('locked');
    setTimeout(()=>closeBtn.focus({preventScroll:true}), 500);
  }
  function close(){
    overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true');
    document.body.classList.remove('locked');
    soloBtn.focus({preventScroll:true});
  }
  soloBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && overlay.classList.contains('open')) close(); });
})();
</script>
